<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Expenses</title>
</head>

<body>
    <a href="/">
        <h1>Home</h1>
    </a>

    <a href="/login">
        <h1>Login</h1>
    </a>
    <h3>Hello: </h3>
    <div class="main-container">
        <form onsubmit="handleFormSubmit(event)" method="post">
            <h2>Expenses</h2>
            <label for="amount">Amount Rs:
                <input type="number" name="amount" , id="amount" required />
            </label>
            <label for="details">Expense details:
                <input type="text" name="details" , id="details" required />
            </label>

            <label for="category">Expense Category:
                <select name="category" id="category" name="category">
                    <option value="petrol">Petrol</option>
                    <option value="Food">Food</option>
                    <option value="Study">Study</option>
                </select>
            </label>
            <button type="submit">Submit</button>
        </form>


        <div class="display-container">
            <ul id="exp-list"></ul>
        </div>
        <script src="/js/expense.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"></script>
    </div>
</body>

</html>
